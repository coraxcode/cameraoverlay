<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Camera Overlay</title>

<style>
  :root{
    --panel-bg: rgba(10,10,12,.72);
    --panel-bg-strong: rgba(10,10,12,.88);
    --panel-border: rgba(255,255,255,.11);
    --text: #fff;
    --muted: rgba(255,255,255,.68);
    --btn: rgba(255,255,255,.10);
    --btn-hover: rgba(255,255,255,.17);
    --accent: #fff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overscroll-behavior:none;
  }

  body{
    position:fixed;
    inset:0;
  }

  #app,
  #cameraStage{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
  }

  #cameraStage{
    touch-action:none;
  }

  #camera{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
    user-select:none;
    -webkit-user-select:none;
  }

  #camera.mirror{
    transform:scaleX(-1);
  }

  #overlayLayer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }

  #overlayImage{
    position:absolute;
    left:50%;
    top:50%;
    max-width:none;
    max-height:none;
    width:62vw;
    height:auto;
    transform:translate(-50%,-50%);
    transform-origin:center center;
    opacity:.45;
    display:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    will-change:left,top,width,opacity;
  }

  #overlayImage.movable{
    pointer-events:auto;
    cursor:grab;
  }

  #overlayImage.dragging{
    cursor:grabbing;
  }

  #topBar{
    position:absolute;
    top:calc(8px + var(--safe-top));
    left:calc(8px + var(--safe-left));
    right:calc(8px + var(--safe-right));
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    z-index:40;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }

  .topGroup{
    display:flex;
    align-items:center;
    gap:6px;
    pointer-events:auto;
  }

  button,
  .fileButton{
    border:1px solid var(--panel-border);
    background:var(--btn);
    color:#fff;
    min-height:36px;
    border-radius:11px;
    padding:0 10px;
    font:inherit;
    font-size:12px;
    font-weight:650;
    cursor:pointer;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 4px 15px rgba(0,0,0,.18);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    white-space:nowrap;
  }

  button:active,
  .fileButton:active{
    transform:scale(.97);
    background:var(--btn-hover);
  }

  button:disabled{
    opacity:.38;
    cursor:default;
  }

  .iconOnly{
    width:36px;
    min-width:36px;
    padding:0;
    font-size:16px;
  }

  #fileInput{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
  }

  #controls{
    position:absolute;
    left:50%;
    bottom:calc(8px + var(--safe-bottom));
    transform:translateX(-50%);
    width:min(390px,calc(100vw - 16px - var(--safe-left) - var(--safe-right)));
    z-index:50;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:15px;
    padding:9px 10px 10px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 8px 28px rgba(0,0,0,.34);
    transition:opacity .18s ease, transform .18s ease;
  }

  .controlRow{
    display:grid;
    grid-template-columns:62px 1fr 38px;
    gap:7px;
    align-items:center;
    min-height:30px;
  }

  .controlRow + .controlRow{
    margin-top:2px;
  }

  .label{
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    letter-spacing:.01em;
  }

  .value{
    color:var(--muted);
    font-size:10px;
    font-variant-numeric:tabular-nums;
    text-align:right;
  }

  input[type="range"]{
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    height:20px;
    margin:0;
    background:transparent;
    touch-action:pan-x;
  }

  input[type="range"]::-webkit-slider-runnable-track{
    height:3px;
    border-radius:999px;
    background:rgba(255,255,255,.25);
  }

  input[type="range"]::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#fff;
    margin-top:-5.5px;
    border:none;
    box-shadow:0 1px 5px rgba(0,0,0,.5);
  }

  input[type="range"]::-moz-range-track{
    height:3px;
    border-radius:999px;
    background:rgba(255,255,255,.25);
  }

  input[type="range"]::-moz-range-thumb{
    width:14px;
    height:14px;
    border-radius:50%;
    background:#fff;
    border:none;
  }

  #modeRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:6px;
    padding-top:7px;
    border-top:1px solid rgba(255,255,255,.08);
  }

  .moveToggle{
    display:flex;
    align-items:center;
    gap:7px;
    min-height:30px;
    color:rgba(255,255,255,.86);
    font-size:11px;
    font-weight:700;
    user-select:none;
    cursor:pointer;
  }

  .moveToggle input{
    width:16px;
    height:16px;
    margin:0;
    accent-color:#fff;
  }

  #actionRow{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
  }

  #actionRow button{
    min-height:30px;
    padding:0 8px;
    border-radius:9px;
    font-size:11px;
    box-shadow:none;
  }

  #status{
    position:absolute;
    left:50%;
    top:50%;
    z-index:25;
    transform:translate(-50%,-50%);
    width:min(86vw,410px);
    text-align:center;
    color:rgba(255,255,255,.90);
    background:rgba(0,0,0,.48);
    border:1px solid rgba(255,255,255,.10);
    padding:11px 13px;
    border-radius:13px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    pointer-events:none;
    font-size:13px;
    line-height:1.35;
  }

  #status.hidden{
    display:none;
  }

  #gestureHint{
    position:absolute;
    left:50%;
    bottom:calc(132px + var(--safe-bottom));
    z-index:28;
    transform:translateX(-50%);
    color:rgba(255,255,255,.78);
    background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.08);
    border-radius:999px;
    padding:6px 10px;
    font-size:10px;
    white-space:nowrap;
    pointer-events:none;
    opacity:0;
    transition:opacity .2s ease;
  }

  #gestureHint.show{
    opacity:1;
  }

  #uiToggle{
    position:absolute;
    right:calc(8px + var(--safe-right));
    bottom:calc(8px + var(--safe-bottom));
    z-index:90;
    width:38px;
    height:38px;
    min-height:38px;
    padding:0;
    border-radius:50%;
    background:rgba(8,8,10,.62);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    font-size:16px;
    display:none;
  }

  body.ui-hidden #topBar,
  body.ui-hidden #controls,
  body.ui-hidden #gestureHint{
    opacity:0;
    pointer-events:none;
  }

  body.ui-hidden #topBar{
    transform:translateY(-10px);
  }

  body.ui-hidden #controls{
    transform:translate(-50%,12px);
  }

  body.ui-hidden #uiToggle{
    display:inline-flex;
  }

  #hideUIBtn{
    min-height:30px;
    padding:0 8px;
    border-radius:9px;
    font-size:11px;
  }

  @media (max-width:420px){
    #controls{
      width:calc(100vw - 12px - var(--safe-left) - var(--safe-right));
      padding:8px 9px 9px;
      border-radius:14px;
    }

    .controlRow{
      grid-template-columns:56px 1fr 34px;
      gap:6px;
    }

    .label{
      font-size:10.5px;
    }

    button,
    .fileButton{
      min-height:34px;
      padding:0 8px;
      font-size:11px;
    }

    .iconOnly{
      width:34px;
      min-width:34px;
    }
  }

  @media (orientation:landscape) and (max-height:520px){
    #controls{
      left:auto;
      right:calc(8px + var(--safe-right));
      bottom:calc(8px + var(--safe-bottom));
      transform:none;
      width:min(360px,48vw);
    }

    body.ui-hidden #controls{
      transform:translateY(12px);
    }

    #gestureHint{
      display:none;
    }
  }
</style>

</head>
<body>
<div id="app">
  <div id="cameraStage">
    <video id="camera" autoplay muted playsinline></video>

    <div id="overlayLayer">
      <img id="overlayImage" alt="Overlay image" draggable="false" />
    </div>

    <div id="status">Tap <strong>Start Camera</strong> and allow camera access when prompted.</div>
    <div id="gestureHint">Pinch: resize • Move: enable “Move image”</div>

    <div id="topBar">
      <div class="topGroup">
        <button id="startBtn" type="button">📷 Start Camera</button>
      </div>

      <div class="topGroup">
        <button id="switchBtn" type="button" class="iconOnly" title="Switch camera" aria-label="Switch camera" disabled>↻</button>
        <label class="fileButton" for="fileInput">＋ Image</label>
        <input id="fileInput" type="file" accept="image/*" />
        <button id="hideUIBtn" type="button" title="Hide controls">⌄ Hide</button>
      </div>
    </div>

    <div id="controls">
      <div class="controlRow">
        <div class="label">Opacity</div>
        <input id="opacityRange" type="range" min="0" max="100" step="1" value="45" />
        <div id="opacityValue" class="value">45%</div>
      </div>

      <div class="controlRow">
        <div class="label">Size</div>
        <input id="sizeRange" type="range" min="10" max="220" step="1" value="62" />
        <div id="sizeValue" class="value">62%</div>
      </div>

      <div id="modeRow">
        <label class="moveToggle">
          <input id="moveToggle" type="checkbox" />
          <span>Move image</span>
        </label>

        <div id="actionRow">
          <button id="centerBtn" type="button" title="Center image">◎ Center</button>
          <button id="hideBtn" type="button" disabled title="Hide image">◐ Image</button>
          <button id="resetBtn" type="button" title="Reset settings">↺</button>
        </div>
      </div>
    </div>

    <button id="uiToggle" type="button" aria-label="Show controls" title="Show controls">☰</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const cameraStage = document.getElementById("cameraStage");
  const video = document.getElementById("camera");
  const overlayImage = document.getElementById("overlayImage");
  const fileInput = document.getElementById("fileInput");

  const startBtn = document.getElementById("startBtn");
  const switchBtn = document.getElementById("switchBtn");
  const centerBtn = document.getElementById("centerBtn");
  const hideBtn = document.getElementById("hideBtn");
  const resetBtn = document.getElementById("resetBtn");
  const moveToggle = document.getElementById("moveToggle");
  const hideUIBtn = document.getElementById("hideUIBtn");
  const uiToggle = document.getElementById("uiToggle");

  const opacityRange = document.getElementById("opacityRange");
  const sizeRange = document.getElementById("sizeRange");
  const opacityValue = document.getElementById("opacityValue");
  const sizeValue = document.getElementById("sizeValue");

  const status = document.getElementById("status");
  const gestureHint = document.getElementById("gestureHint");

  let stream = null;
  let facingMode = "environment";
  let objectUrl = null;
  let startInProgress = false;
  let knownVideoDevices = [];

  let overlayVisible = true;
  let overlayScalePercent = 62;
  let overlayOpacity = 45;
  let overlayPosX = 50;
  let overlayPosY = 50;

  const activePointers = new Map();
  let pinchStartDistance = null;
  let pinchStartScale = null;
  let dragPointerId = null;
  let dragOffsetX = 0;
  let dragOffsetY = 0;

  const isIOS =
    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(navigator.userAgent);

  function setStatus(message, visible = true) {
    status.innerHTML = message;
    status.classList.toggle("hidden", !visible);
  }

  function showHint(message, duration = 1800) {
    gestureHint.textContent = message;
    gestureHint.classList.add("show");
    window.clearTimeout(showHint.timer);
    showHint.timer = window.setTimeout(() => {
      gestureHint.classList.remove("show");
    }, duration);
  }

  function stopCamera() {
    if (stream) {
      for (const track of stream.getTracks()) {
        try { track.stop(); } catch (_) {}
      }
    }
    stream = null;
    try { video.pause(); } catch (_) {}
    video.srcObject = null;
    video.classList.remove("mirror");
    switchBtn.disabled = true;
  }

  function getUserMediaCompat(constraints) {
    if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function") {
      return navigator.mediaDevices.getUserMedia(constraints);
    }

    const legacy =
      navigator.getUserMedia ||
      navigator.webkitGetUserMedia ||
      navigator.mozGetUserMedia;

    if (legacy) {
      return new Promise((resolve, reject) => {
        legacy.call(navigator, constraints, resolve, reject);
      });
    }

    return Promise.reject(
      Object.assign(new Error("getUserMedia is unavailable"), {
        name: "GetUserMediaUnavailable"
      })
    );
  }

  async function refreshVideoDevices() {
    if (!navigator.mediaDevices || typeof navigator.mediaDevices.enumerateDevices !== "function") {
      knownVideoDevices = [];
      return;
    }

    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      knownVideoDevices = devices.filter(device => device.kind === "videoinput");
    } catch (_) {
      knownVideoDevices = [];
    }
  }

  function buildConstraintAttempts(preferredFacing) {
    return [
      {
        audio: false,
        video: { facingMode: { ideal: preferredFacing } }
      },
      {
        audio: false,
        video: {
          facingMode: preferredFacing,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      },
      {
        audio: false,
        video: true
      }
    ];
  }

  async function requestCameraStream(preferredFacing) {
    let lastError = null;

    for (const constraints of buildConstraintAttempts(preferredFacing)) {
      try {
        const candidate = await getUserMediaCompat(constraints);
        if (candidate?.getVideoTracks?.().length) return candidate;
        candidate?.getTracks?.().forEach(track => track.stop());
      } catch (error) {
        lastError = error;
        if (
          error?.name === "NotAllowedError" ||
          error?.name === "PermissionDeniedError" ||
          error?.name === "SecurityError"
        ) {
          throw error;
        }
      }
    }

    throw lastError || Object.assign(new Error("Camera unavailable"), { name: "CameraUnavailable" });
  }

  async function waitForVideoReady(timeoutMs = 8000) {
    if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) return;

    await new Promise((resolve, reject) => {
      let finished = false;

      const cleanup = () => {
        window.clearTimeout(timer);
        video.removeEventListener("loadedmetadata", onReady);
        video.removeEventListener("canplay", onReady);
      };

      const finish = (ok) => {
        if (finished) return;
        finished = true;
        cleanup();
        if (ok) resolve();
        else reject(Object.assign(new Error("Video did not become ready"), { name: "VideoReadyTimeout" }));
      };

      const onReady = () => {
        if (video.videoWidth > 0 && video.videoHeight > 0) finish(true);
      };

      const timer = window.setTimeout(() => finish(false), timeoutMs);
      video.addEventListener("loadedmetadata", onReady);
      video.addEventListener("canplay", onReady);
    });
  }

  function cameraErrorMessage(error) {
    const name = error?.name || "";

    if (name === "NotAllowedError" || name === "PermissionDeniedError" || name === "SecurityError") {
      if (location.protocol === "file:") {
        return "The browser blocked camera access for this local HTML file. The app did attempt to open the camera. Try opening this same file in the device's main browser rather than an in-app file preview.";
      }
      if (isIOS) {
        return "Camera access was denied. In Safari, open the website settings, set <strong>Camera → Allow</strong>, then tap <strong>Start Camera</strong> again.";
      }
      if (isAndroid) {
        return "Camera access was denied. In Chrome, open <strong>Site permissions → Camera → Allow</strong>, then tap <strong>Start Camera</strong> again.";
      }
      return "Camera access was denied by the browser. Allow camera permission and try again.";
    }

    if (name === "NotFoundError" || name === "DevicesNotFoundError") {
      return "No usable camera was found on this device.";
    }

    if (name === "NotReadableError" || name === "TrackStartError") {
      return "The camera is present but unavailable. Close other apps that may be using it and try again.";
    }

    if (name === "OverconstrainedError" || name === "ConstraintNotSatisfiedError") {
      return "The camera rejected the requested settings. The app also tried fallback settings, but none were accepted.";
    }

    if (name === "VideoReadyTimeout") {
      return "Camera permission was granted, but the live video did not start. Close and reopen the page, then try again.";
    }

    if (name === "GetUserMediaUnavailable") {
      return "This browser or file viewer does not expose camera access to HTML pages. Open the file in the device's main browser.";
    }

    return `The camera could not be started${name ? ` (${name})` : ""}.`;
  }

  async function attachStream(candidate) {
    stream = candidate;

    video.setAttribute("autoplay", "");
    video.setAttribute("muted", "");
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.srcObject = stream;

    try { await video.play(); } catch (_) {}
    await waitForVideoReady();
    try { await video.play(); } catch (_) {}

    const track = stream.getVideoTracks()[0];
    const settings = track?.getSettings?.() || {};
    const actualFacing = settings.facingMode || facingMode;

    if (actualFacing === "user" || actualFacing === "environment") {
      facingMode = actualFacing;
    }

    video.classList.toggle("mirror", facingMode === "user");

    await refreshVideoDevices();
    switchBtn.disabled = knownVideoDevices.length === 1;
  }

  async function startCamera() {
    if (startInProgress) return;

    startInProgress = true;
    startBtn.disabled = true;
    switchBtn.disabled = true;
    setStatus("Requesting camera access…");

    try {
      stopCamera();
      const candidate = await requestCameraStream(facingMode);
      await attachStream(candidate);
      setStatus("", false);
      startBtn.textContent = "✓ Camera Active";
      switchBtn.disabled = false;
    } catch (error) {
      console.error("Camera error:", error);
      stopCamera();
      startBtn.textContent = "📷 Start Camera";
      setStatus(cameraErrorMessage(error));
    } finally {
      startInProgress = false;
      startBtn.disabled = false;
      if (stream) switchBtn.disabled = false;
    }
  }

  async function switchCamera() {
    if (startInProgress) return;
    facingMode = facingMode === "environment" ? "user" : "environment";
    await startCamera();
  }

  function loadOverlay(file) {
    if (!file || !file.type?.startsWith("image/")) {
      setStatus("Please choose a valid image file.");
      return;
    }

    if (objectUrl) {
      URL.revokeObjectURL(objectUrl);
      objectUrl = null;
    }

    objectUrl = URL.createObjectURL(file);

    overlayImage.onload = () => {
      overlayVisible = true;
      overlayImage.style.display = "block";
      hideBtn.disabled = false;
      hideBtn.textContent = "◐ Image";
      centerOverlay();
      setStatus("", false);
      showHint('Pinch to resize • enable "Move image" to drag', 2200);
    };

    overlayImage.onerror = () => {
      setStatus("The selected image could not be loaded.");
    };

    overlayImage.src = objectUrl;
  }

  function setOpacity(value) {
    const numeric = Number(value);
    overlayOpacity = Number.isFinite(numeric) ? Math.max(0, Math.min(100, numeric)) : 45;
    overlayImage.style.opacity = String(overlayOpacity / 100);
    opacityRange.value = String(Math.round(overlayOpacity));
    opacityValue.textContent = `${Math.round(overlayOpacity)}%`;
  }

  function setSize(value) {
    const numeric = Number(value);
    overlayScalePercent = Number.isFinite(numeric) ? Math.max(10, Math.min(220, numeric)) : 62;

    if (window.matchMedia("(orientation: landscape)").matches) {
      const target = Math.max(
        40,
        Math.min(window.innerWidth * overlayScalePercent / 100, window.innerHeight * 1.6)
      );
      overlayImage.style.width = `${target}px`;
    } else {
      overlayImage.style.width = `${overlayScalePercent}vw`;
    }

    sizeRange.value = String(Math.round(overlayScalePercent));
    sizeValue.textContent = `${Math.round(overlayScalePercent)}%`;
  }

  function applyOverlayPosition() {
    overlayImage.style.left = `${overlayPosX}%`;
    overlayImage.style.top = `${overlayPosY}%`;
    overlayImage.style.transform = "translate(-50%, -50%)";
  }

  function centerOverlay() {
    overlayPosX = 50;
    overlayPosY = 50;
    applyOverlayPosition();
  }

  function setMoveMode(enabled) {
    overlayImage.classList.toggle("movable", enabled);
    if (!enabled) {
      overlayImage.classList.remove("dragging");
      dragPointerId = null;
    }
  }

  function hideInterface() {
    document.body.classList.add("ui-hidden");
  }

  function showInterface() {
    document.body.classList.remove("ui-hidden");
  }

  function toggleOverlay() {
    if (!overlayImage.src) return;
    overlayVisible = !overlayVisible;
    overlayImage.style.display = overlayVisible ? "block" : "none";
    hideBtn.textContent = overlayVisible ? "◐ Image" : "◑ Show";
  }

  function resetOverlay() {
    setOpacity(45);
    setSize(62);
    centerOverlay();
    moveToggle.checked = false;
    setMoveMode(false);
    showInterface();

    if (overlayImage.src) {
      overlayVisible = true;
      overlayImage.style.display = "block";
      hideBtn.disabled = false;
      hideBtn.textContent = "◐ Image";
    }
  }

  function distanceBetweenPointers() {
    if (activePointers.size !== 2) return null;
    const points = [...activePointers.values()];
    return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
  }

  function beginPinchIfPossible() {
    if (activePointers.size !== 2) return;
    pinchStartDistance = distanceBetweenPointers();
    pinchStartScale = overlayScalePercent;

    if (dragPointerId !== null) {
      overlayImage.classList.remove("dragging");
      dragPointerId = null;
    }
  }

  cameraStage.addEventListener("pointerdown", event => {
    if (!overlayImage.src || !overlayVisible) return;

    activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (activePointers.size === 2) {
      beginPinchIfPossible();
      event.preventDefault();
      return;
    }

    if (moveToggle.checked && event.target === overlayImage) {
      dragPointerId = event.pointerId;
      overlayImage.classList.add("dragging");

      const rect = cameraStage.getBoundingClientRect();
      const currentX = rect.left + rect.width * (overlayPosX / 100);
      const currentY = rect.top + rect.height * (overlayPosY / 100);
      dragOffsetX = event.clientX - currentX;
      dragOffsetY = event.clientY - currentY;

      try { overlayImage.setPointerCapture(event.pointerId); } catch (_) {}
      event.preventDefault();
    }
  }, { passive: false });

  cameraStage.addEventListener("pointermove", event => {
    if (!activePointers.has(event.pointerId)) return;

    activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (activePointers.size === 2 && pinchStartDistance && pinchStartScale) {
      const currentDistance = distanceBetweenPointers();
      if (currentDistance) {
        setSize(pinchStartScale * (currentDistance / pinchStartDistance));
      }
      event.preventDefault();
      return;
    }

    if (dragPointerId === event.pointerId && moveToggle.checked) {
      const rect = cameraStage.getBoundingClientRect();
      const x = ((event.clientX - dragOffsetX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - dragOffsetY - rect.top) / rect.height) * 100;

      overlayPosX = Math.max(-20, Math.min(120, x));
      overlayPosY = Math.max(-20, Math.min(120, y));
      applyOverlayPosition();
      event.preventDefault();
    }
  }, { passive: false });

  function releasePointer(event) {
    if (dragPointerId === event.pointerId) {
      overlayImage.classList.remove("dragging");
      try { overlayImage.releasePointerCapture(event.pointerId); } catch (_) {}
      dragPointerId = null;
    }

    activePointers.delete(event.pointerId);

    if (activePointers.size < 2) {
      pinchStartDistance = null;
      pinchStartScale = null;
    }
  }

  cameraStage.addEventListener("pointerup", releasePointer, { passive: true });
  cameraStage.addEventListener("pointercancel", releasePointer, { passive: true });

  opacityRange.addEventListener("input", () => setOpacity(opacityRange.value));
  sizeRange.addEventListener("input", () => setSize(sizeRange.value));

  fileInput.addEventListener("change", () => {
    const file = fileInput.files?.[0];
    if (file) loadOverlay(file);
    fileInput.value = "";
  });

  startBtn.addEventListener("click", startCamera);
  switchBtn.addEventListener("click", switchCamera);
  centerBtn.addEventListener("click", centerOverlay);
  hideBtn.addEventListener("click", toggleOverlay);
  resetBtn.addEventListener("click", resetOverlay);

  moveToggle.addEventListener("change", () => {
    setMoveMode(moveToggle.checked);
    if (moveToggle.checked && overlayImage.src) {
      showHint("Drag with one finger • pinch with two fingers • disable Move image to lock", 2200);
    }
  });

  hideUIBtn.addEventListener("click", hideInterface);
  uiToggle.addEventListener("click", showInterface);

  window.addEventListener("resize", () => {
    setSize(overlayScalePercent);
    applyOverlayPosition();
  }, { passive: true });

  window.addEventListener("orientationchange", () => {
    window.setTimeout(() => {
      setSize(overlayScalePercent);
      applyOverlayPosition();
    }, 250);
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && stream && video.paused) {
      video.play().catch(() => {});
    }
  });

  window.addEventListener("pagehide", () => {
    stopCamera();
    if (objectUrl) {
      URL.revokeObjectURL(objectUrl);
      objectUrl = null;
    }
  });

  setOpacity(45);
  setSize(62);
  centerOverlay();

  if (location.protocol === "file:") {
    setStatus("Local file detected. Tap <strong>Start Camera</strong>; the app will attempt camera access directly.");
  } else {
    setStatus("Tap <strong>Start Camera</strong> and allow camera access when prompted.");
  }
})();
</script>
</body>
</html>
